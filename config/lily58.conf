# nice!view display
CONFIG_ZMK_DISPLAY=y

# Use the nice-view-gem screens (animated crystal on the right half)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Optional: turn the screens off when the keyboard goes idle to save battery.
# Remove the # at the start of the next line to enable it.
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
